name: Security Scan

on:
  push:
    branches: [ main, feature/**, Feature/**, bugfix/**, Bugfix/** ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        id: trivy_scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'
          format: 'table'
        continue-on-error: true

      - name: Summarize Trivy advisory failure
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.trivy_scan.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" = "failure" ]; then
            echo "::warning::Trivy filesystem scan failed or returned an incomplete result. This job remains advisory and should not be treated as a clean pass."
            {
              echo "### Advisory scan warning: Trivy"
              echo
              echo "Trivy failed or returned an incomplete result in this run."
              echo "Treat this job as advisory noise, not a clean pass."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend runtime dependencies)
        working-directory: ./frontend
        run: npm audit --package-lock-only --omit=dev --audit-level=high

      - name: npm audit (frontend all dependencies, advisory)
        id: frontend_audit_all
        working-directory: ./frontend
        run: npm audit --package-lock-only --audit-level=high
        continue-on-error: true

      - name: Summarize frontend all-dependency audit advisory failure
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.frontend_audit_all.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" = "failure" ]; then
            echo "::warning::Frontend all-dependency npm audit reported high or critical findings in dev/build/test tooling. Runtime dependency audit remains the blocking gate."
            {
              echo "### Advisory scan warning: frontend all-dependency npm audit"
              echo
              echo "The all-dependency frontend npm audit reported findings in this run."
              echo "Runtime dependencies remain the blocking gate; dev/build/test tooling findings are advisory."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan
        id: semgrep_scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/nodejs
            p/java
            p/secrets
        continue-on-error: true

      - name: Summarize Semgrep advisory failure
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.semgrep_scan.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" = "failure" ]; then
            echo "::warning::Semgrep scan failed or returned an incomplete result. This job remains advisory and should not be treated as a clean pass."
            {
              echo "### Advisory scan warning: Semgrep"
              echo
              echo "Semgrep failed or returned an incomplete result in this run."
              echo "Treat this job as advisory noise, not a clean pass."
            } >> "$GITHUB_STEP_SUMMARY"
          fi