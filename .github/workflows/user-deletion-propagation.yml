name: User Deletion Propagation

on:
  pull_request:
    branches: [main, feature/**, Feature/**, bugfix/**, Bugfix/**]
    paths:
      - "auth-service/**"
      - "workout_service/**"
      - "gateway/**"
      - "ops/local/docker-compose.yml"
      - "ops/local/.env.ci.example"
      - ".github/workflows/user-deletion-propagation.yml"
      - "ops/scripts/wait_for_gateway_stack.sh"
      - "ops/scripts/test_user_deletion_propagation.py"
  push:
    branches: [main, feature/**, Feature/**, bugfix/**, Bugfix/**]
    paths:
      - "auth-service/**"
      - "workout_service/**"
      - "gateway/**"
      - "ops/local/docker-compose.yml"
      - "ops/local/.env.ci.example"
      - ".github/workflows/user-deletion-propagation.yml"
      - "ops/scripts/wait_for_gateway_stack.sh"
      - "ops/scripts/test_user_deletion_propagation.py"

jobs:
  auth-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./auth-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run auth-service tests
        run: |
          chmod +x gradlew
          ./gradlew test

  gateway-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"

      - name: Run gateway tests
        run: |
          chmod +x gradlew
          ./gradlew test

  workout-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./workout_service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"

      - name: Run workout-service tests
        run: |
          chmod +x gradlew
          ./gradlew test

  propagation-smoke:
    runs-on: ubuntu-latest
    needs:
      - auth-tests
      - gateway-tests
      - workout-tests
    env:
      COMPOSE_PROJECT_NAME: propagation-smoke-${{ github.run_id }}
      CI_COMPOSE_FILE: ops/local/docker-compose.yml
      CI_COMPOSE_ENV_FILE: /tmp/ops-local-ci.env

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"

      - name: Generate CI compose env file
        run: cp ops/local/.env.ci.example "$CI_COMPOSE_ENV_FILE"

      - name: Validate CI compose config
        run: docker compose --env-file "$CI_COMPOSE_ENV_FILE" -f "$CI_COMPOSE_FILE" config

      - name: Ensure shared Docker network exists
        run: docker network inspect dedicate_network >/dev/null 2>&1 || docker network create dedicate_network

      - name: Start full stack
        run: docker compose --env-file "$CI_COMPOSE_ENV_FILE" -f "$CI_COMPOSE_FILE" up -d --build

      - name: Wait for gateway stack readiness
        run: bash ops/scripts/wait_for_gateway_stack.sh

      - name: Run propagation smoke
        env:
          COMPOSE_FILE: ${{ env.CI_COMPOSE_FILE }}
          COMPOSE_ENV_FILE: ${{ env.CI_COMPOSE_ENV_FILE }}
        run: python3 ops/scripts/test_user_deletion_propagation.py

      - name: Show compose status on failure
        if: failure()
        run: docker compose --env-file "$CI_COMPOSE_ENV_FILE" -f "$CI_COMPOSE_FILE" ps

      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file "$CI_COMPOSE_ENV_FILE" -f "$CI_COMPOSE_FILE" logs --no-color --timestamps dedicate-kafka dedicate-auth-db dedicate-auth-redis dedicate-auth-service dedicate-workout-db dedicate-workout-service api-gateway

      - name: Stop stack
        if: always()
        run: |
          if [ ! -f "$CI_COMPOSE_ENV_FILE" ]; then
            cp ops/local/.env.ci.example "$CI_COMPOSE_ENV_FILE"
          fi
          docker compose --env-file "$CI_COMPOSE_ENV_FILE" -f "$CI_COMPOSE_FILE" down -v
