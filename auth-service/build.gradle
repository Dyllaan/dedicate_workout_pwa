plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.13'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.owasp.dependencycheck' version '12.2.1'
}

group = 'com.louisfiges'
version = '2.0.6'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

springBoot {
    buildInfo()
}

repositories {
    mavenCentral()
}

def odcDataDir = System.getenv('ODC_DATA_DIR') ?: "${System.getProperty('user.home')}/.gradle/dependency-check-data"
def odcAutoUpdate = System.getenv('ODC_AUTO_UPDATE')?.toBoolean()
def odcOssIndexEnabled = System.getenv('ODC_OSS_INDEX_ENABLED')?.toBoolean()
def odcCi = System.getenv('CI')?.toBoolean() ?: false
def flywayVersion = '11.7.2'

dependencyCheck {
    autoUpdate = odcAutoUpdate != null ? odcAutoUpdate : true
    failBuildOnCVSS = 7.0
    data {
        directory = odcDataDir
    }
    analyzers {
        ossIndex {
            enabled = odcOssIndexEnabled != null ? odcOssIndexEnabled : !odcCi
        }
    }
    nvd {
        apiKey = System.getenv('NVD_API_KEY')
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.hibernate.orm:hibernate-community-dialects'
    implementation 'io.github.cdimascio:dotenv-java:3.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'com.github.bastiaanjansen:otp-java:2.0.3'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'org.xerial:sqlite-jdbc:3.45.0.0'
    runtimeOnly 'org.postgresql:postgresql:42.7.7'
    runtimeOnly "org.flywaydb:flyway-database-postgresql:${flywayVersion}"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:kafka:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.20.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
