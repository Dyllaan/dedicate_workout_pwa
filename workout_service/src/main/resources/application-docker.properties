spring.application.name=workout
server.port=8081

# JPA/Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_first_level_cache=false
spring.jpa.properties.hibernate.generate_statistics=${SPRING_JPA_PROPERTIES_HIBERNATE_GENERATE_STATISTICS:false}
spring.jpa.show-sql=false


logging.level.org.springframework.web=INFO

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.data.redis.host=${WORKOUT_REDIS_HOST:dedicate-workout-redis}
spring.data.redis.port=${WORKOUT_REDIS_PORT:6379}

# Supabase SSL Configuration (REQUIRED)
spring.datasource.hikari.data-source-properties.ssl=${DB_SSL_ENABLED:true}
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSL_MODE:require}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Server Configuration
server.error.include-message=always
logging.level.org.springframework.security=INFO
logging.structured.format.console=logstash

# Validation Constraints
min.sets=1
max.sets=100
min.reps=0
max.reps=1000
plateau.window=5
plateau.threshold.percent=2.0
min.string.length=3
max.string.length=64
app.perf.request-metrics.enabled=${APP_PERF_REQUEST_METRICS_ENABLED:false}
app.analytics.cache.enabled=${APP_ANALYTICS_CACHE_ENABLED:true}
app.analytics.cache.redis.enabled=${APP_ANALYTICS_CACHE_REDIS_ENABLED:true}
