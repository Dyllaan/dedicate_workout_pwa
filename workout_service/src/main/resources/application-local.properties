spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.com.louisfiges.workout.service.analysis.MuscleHeatmapService=DEBUG
spring.data.redis.host=${WORKOUT_REDIS_HOST:localhost}
spring.data.redis.port=${WORKOUT_REDIS_PORT:6379}
app.analytics.cache.enabled=${APP_ANALYTICS_CACHE_ENABLED:true}
app.analytics.cache.redis.enabled=${APP_ANALYTICS_CACHE_REDIS_ENABLED:true}
