spring.application.name=AuthService
server.port=8010

# JPA/Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_first_level_cache=false
spring.jpa.show-sql=false

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Supabase SSL Configuration
spring.datasource.hikari.data-source-properties.ssl=${DB_SSL_ENABLED:true}
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSL_MODE:require}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

logging.level.root=INFO
logging.level.com.louisfiges=INFO
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO
logging.structured.format.console=logstash
