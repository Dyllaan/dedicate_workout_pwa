plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.owasp.dependencycheck' version '12.2.1'
}

group = 'com.louisfiges.workout'
version = '3.0.12'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

springBoot {
    buildInfo()
}

repositories {
    mavenCentral()
}

def odcDataDir = System.getenv('ODC_DATA_DIR') ?: "${System.getProperty('user.home')}/.gradle/dependency-check-data"
def odcAutoUpdate = System.getenv('ODC_AUTO_UPDATE')?.toBoolean()
def odcOssIndexEnabled = System.getenv('ODC_OSS_INDEX_ENABLED')?.toBoolean()
def odcCi = System.getenv('CI')?.toBoolean() ?: false
def flywayVersion = '11.7.2'

dependencyCheck {
    autoUpdate = odcAutoUpdate != null ? odcAutoUpdate : true
    failBuildOnCVSS = 7.0
    data {
        directory = odcDataDir
    }
    analyzers {
        ossIndex {
            enabled = odcOssIndexEnabled != null ? odcOssIndexEnabled : !odcCi
        }
    }
    nvd {
        apiKey = System.getenv('NVD_API_KEY')
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'io.github.cdimascio:dotenv-java:3.1.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'ch.qos.logback:logback-classic:1.5.12'
    implementation 'org.antlr:antlr4-runtime:4.13.0'
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation 'org.hibernate.orm:hibernate-community-dialects'
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    implementation 'org.webjars:swagger-ui:5.20.1'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.xerial:sqlite-jdbc:3.45.0.0'

    runtimeOnly "org.flywaydb:flyway-database-postgresql:${flywayVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.awaitility:awaitility:4.2.2'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.testcontainers:kafka:1.21.4'
    testRuntimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    testRuntimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    testImplementation 'org.xerial:sqlite-jdbc:3.45.1.0'
}

tasks.named('test') {
    useJUnitPlatform()
}
