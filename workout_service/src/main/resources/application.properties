spring.application.name=workout
server.port=8081

spring.datasource.url=jdbc:sqlite:workout.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_first_level_cache=false

# Server Configuration
server.error.include-message=always

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
# Validation Constraints
min.sets=1
max.sets=100
min.reps=0
max.reps=1000
min.string.length=3
max.string.length=64

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${app.kafka.user-deleted-group-id}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.user-deleted-topic=user.deleted.v1
app.kafka.user-deleted-dlt-topic=user.deleted.v1.dlt
app.kafka.user-deleted-group-id=workout-service-user-cleanup
plateau.window=5
plateau.threshold.percent=2.0
app.analytics.cache.enabled=false
app.analytics.cache.redis.enabled=false
app.analytics.cache.snapshot-ttl=PT5M
app.analytics.cache.response-ttl=PT2M
app.analytics.cache.reference-ttl=PT30M
