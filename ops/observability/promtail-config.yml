server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://dedicate-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_dedicate_logging_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_docker_container_label_dedicate_logging_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_dedicate_logging_environment]
        target_label: environment
      - source_labels: [__meta_docker_container_label_dedicate_logging_component]
        target_label: component
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
        replacement: "$1"
      - source_labels: [__meta_docker_container_id]
        regex: "(.+)"
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/$1-json.log
    pipeline_stages:
      - template:
          source: job
          template: docker
      - labels:
          job:
      - docker: {}
