name: Build and Push
on:
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force all services to build, test, and push?'
        required: true
        type: boolean
        default: true
  push:
    branches: [ main, feature/**, Feature/**, bugfix/**, Bugfix/** ]
  pull_request:
    branches: [ main ]
env:
  REGISTRY: dflouis
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      auth: ${{ steps.filter.outputs.auth == 'true' || github.event.inputs.force_all == 'true' }}
      gateway: ${{ steps.filter.outputs.gateway == 'true' || github.event.inputs.force_all == 'true' }}
      workout: ${{ steps.filter.outputs.workout == 'true' || github.event.inputs.force_all == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event.inputs.force_all == 'true' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect changed services
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          auth:
            - 'auth-service/**'
            - '.dockerignore'
            - 'ops/scripts/jlink-runtime.sh'
            - '.github/workflows/deploy.yml'
          gateway:
            - 'gateway/**'
            - '.dockerignore'
            - 'ops/scripts/jlink-runtime.sh'
            - '.github/workflows/deploy.yml'
          workout:
            - 'workout_service/**'
            - '.dockerignore'
            - 'ops/scripts/jlink-runtime.sh'
            - '.github/workflows/deploy.yml'
          frontend:
            - 'frontend/**'
            - 'ops/local/docker-compose.yml'
            - 'ops/local/.env.ci.example'
            - '.github/workflows/deploy.yml'
            - 'ops/scripts/wait_for_gateway_stack.sh'

  build-and-verify:
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21 for auth-service
      if: needs.detect-changes.outputs.auth == 'true'
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build Auth Service
      if: needs.detect-changes.outputs.auth == 'true'
      working-directory: ./auth-service
      run: |
        chmod +x gradlew
        ./gradlew build -x test

    - name: Set up JDK 21
      if: needs.detect-changes.outputs.gateway == 'true' || needs.detect-changes.outputs.workout == 'true' || needs.detect-changes.outputs.frontend == 'true'
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build API Gateway
      if: needs.detect-changes.outputs.gateway == 'true'
      working-directory: ./gateway
      run: |
        chmod +x gradlew
        ./gradlew build -x test

    - name: Build Workout Service
      if: needs.detect-changes.outputs.workout == 'true'
      working-directory: ./workout_service
      run: |
        chmod +x gradlew
        ./gradlew build -x test

    - name: Set up Node.js
      if: needs.detect-changes.outputs.frontend == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install frontend dependencies
      if: needs.detect-changes.outputs.frontend == 'true'
      working-directory: ./frontend
      run: npm ci

    - name: Build Frontend
      if: needs.detect-changes.outputs.frontend == 'true'
      working-directory: ./frontend
      run: |
        rm -rf dist .vite
        npm run build -- --mode production

    - name: Verify frontend security headers through Nginx
      if: needs.detect-changes.outputs.frontend == 'true'
      run: |
        docker build -f frontend/docker/Dockerfile -t dedicate-frontend-security-test ./frontend
        docker run -d --rm --name dedicate-frontend-security-test -p 4180:80 dedicate-frontend-security-test
        for i in {1..20}; do
          if curl -fsS http://127.0.0.1:4180/ > /dev/null; then
            break
          fi
          sleep 2
        done
        node frontend/tests/scripts/verify-nginx-security-headers.mjs http://127.0.0.1:4180/
        node frontend/tests/scripts/verify-spa-fallback.mjs http://127.0.0.1:4180/

    - name: Stop frontend security test container
      if: always() && needs.detect-changes.outputs.frontend == 'true'
      run: docker rm -f dedicate-frontend-security-test || true

  validate-image-builds:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-and-verify

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21 for auth-service image build
      if: needs.detect-changes.outputs.auth == 'true'
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build auth-service jar for Docker packaging
      if: needs.detect-changes.outputs.auth == 'true'
      working-directory: ./auth-service
      run: |
        chmod +x gradlew
        ./gradlew bootJar -x test

    - name: Set up JDK 21 for gateway and workout image builds
      if: needs.detect-changes.outputs.gateway == 'true' || needs.detect-changes.outputs.workout == 'true'
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build workout-service jar for Docker packaging
      if: needs.detect-changes.outputs.workout == 'true'
      working-directory: ./workout_service
      run: |
        chmod +x gradlew
        ./gradlew bootJar -x test

    - name: Set up Node.js for frontend image build
      if: needs.detect-changes.outputs.frontend == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build frontend dist for Docker packaging
      if: needs.detect-changes.outputs.frontend == 'true'
      working-directory: ./frontend
      run: |
        npm ci
        npm run build -- --mode production

    - name: Build frontend image
      if: needs.detect-changes.outputs.frontend == 'true'
      run: docker build -f frontend/docker/Dockerfile -t dedicate-frontend-ci:${{ github.sha }} ./frontend

    - name: Build auth-service image
      if: needs.detect-changes.outputs.auth == 'true'
      run: docker build -f auth-service/Dockerfile -t dedicate-auth-service-ci:${{ github.sha }} .

    - name: Build gateway image
      if: needs.detect-changes.outputs.gateway == 'true'
      run: docker build -f gateway/Dockerfile -t dedicate-api-gateway-ci:${{ github.sha }} .

    - name: Build workout-service image
      if: needs.detect-changes.outputs.workout == 'true'
      run: docker build -f workout_service/Dockerfile -t dedicate-workout-service-ci:${{ github.sha }} .

  build-and-push-images:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-and-verify
      - validate-image-builds
    # Updated to allow pushes on workflow_dispatch from the main branch
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js for frontend image build
      if: needs.detect-changes.outputs.frontend == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Rebuild frontend dist for image packaging
      if: needs.detect-changes.outputs.frontend == 'true'
      working-directory: ./frontend
      run: |
        npm ci
        npm run build -- --mode production

    - name: Login to Docker Hub
      if: needs.detect-changes.outputs.auth == 'true' || needs.detect-changes.outputs.gateway == 'true' || needs.detect-changes.outputs.workout == 'true' || needs.detect-changes.outputs.frontend == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build and Push Frontend
      if: needs.detect-changes.outputs.frontend == 'true'
      run: |
        docker build -f frontend/docker/Dockerfile -t ${{ env.REGISTRY }}/dedicate-frontend:${{ env.IMAGE_TAG }} ./frontend
        docker push ${{ env.REGISTRY }}/dedicate-frontend:${{ env.IMAGE_TAG }}

    - name: Build and Push Auth Service
      if: needs.detect-changes.outputs.auth == 'true'
      run: |
        docker build -f auth-service/Dockerfile -t ${{ env.REGISTRY }}/dedicate-auth-service:${{ env.IMAGE_TAG }} .
        docker push ${{ env.REGISTRY }}/dedicate-auth-service:${{ env.IMAGE_TAG }}

    - name: Build and Push Gateway
      if: needs.detect-changes.outputs.gateway == 'true'
      run: |
        docker build -f gateway/Dockerfile -t ${{ env.REGISTRY }}/dedicate-api-gateway:${{ env.IMAGE_TAG }} .
        docker push ${{ env.REGISTRY }}/dedicate-api-gateway:${{ env.IMAGE_TAG }}

    - name: Build and Push Workout Service
      if: needs.detect-changes.outputs.workout == 'true'
      run: |
        docker build -f workout_service/Dockerfile -t ${{ env.REGISTRY }}/dedicate-workout-service:${{ env.IMAGE_TAG }} .
        docker push ${{ env.REGISTRY }}/dedicate-workout-service:${{ env.IMAGE_TAG }}